{% extends "base.html" %}

{% block title %}Anunciar{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-50 p-4">

    <!-- HEADER -->
    <div class="w-full md:w-[70%] lg:w-[50%] mx-auto mb-6">
        <h1 class="text-3xl font-bold text-slate-900">
            Anunciar Produto
        </h1>

        <p class="text-slate-500 mt-1">
            Preencha as informações do seu produto
        </p>
    </div>

    <!-- FORM -->
    <form
        action=""
        method="POST"
        enctype="multipart/form-data"
        class="bg-white border border-slate-200 rounded-3xl shadow-sm p-5 flex flex-col gap-5 w-full md:w-[70%] lg:w-[50%] mx-auto"
    >
                {% with error = get_flashed_messages() %}
                {% if error %}
                    <p class="text-red-400 flex justify-center">{{error[0]}}</p>
                {%endif%}
                {%endwith%}
        <!-- NOME -->
        <div class="flex flex-col gap-2">
            <label class="text-slate-700 font-semibold">
                Nome do produto
            </label>

            <input
                type="text"
                name="titulo"
                required
                placeholder="Ex: iPhone 13 Pro Max"
                class="border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

        <!-- PROVINCIA -->
        <div class="flex flex-col gap-2">
            <label class="text-slate-700 font-semibold">
                Província
            </label>

            <select
                name="provincia"
                required
                class="border border-slate-200 rounded-xl p-3 bg-white outline-none focus:ring-2 focus:ring-blue-500"
            >
                <option value="">Selecione a província</option>
                <option>Maputo Cidade</option>
                <option>Maputo Província</option>
                <option>Gaza</option>
                <option>Inhambane</option>
                <option>Sofala</option>
                <option>Manica</option>
                <option>Tete</option>
                <option>Zambézia</option>
                <option>Nampula</option>
                <option>Cabo Delgado</option>
                <option>Niassa</option>
            </select>
        </div>

        <!-- CATEGORIA -->
        <div class="flex flex-col gap-2">
            <label class="text-slate-700 font-semibold">
                Categoria
            </label>

            <select
                name="categoria"
                required
                class="border border-slate-200 rounded-xl p-3 bg-white outline-none focus:ring-2 focus:ring-blue-500"
            >
                <option value="">Selecione a categoria</option>
                <option value="telefones">Telefones</option>
                <option value="computadore">Computadores</option>
                <option value="tvs">Televisores</option>
                <option value="carros">Carros</option>
                <option value="motos">Motos</option>
                <option value="roupas">Roupas</option>
                <option value="electrodomesticos">Electrodomesticos</option>
                <option value="utensilios">Utensilios</option>
                <option value="som">Som</option>
                <option value="brinquedos">Brinquedos</option>
                <option value="documentos">Documentos</option>
                <option value="alimentos">Alimentos</option>
                <option value="bebidas">Bebidas</option>
            </select>
        </div>

        <!-- PREÇO -->
        <div class="flex flex-col gap-2">
            <label class="text-slate-700 font-semibold">
                Preço
            </label>

            <input
                type="number"
                name="preco"
                required
                placeholder="Ex: 15000"
                class="border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

        <!-- DESCRIÇÃO -->
        <div class="flex flex-col gap-2">
            <label class="text-slate-700 font-semibold">
                Descrição
            </label>

            <textarea
                name="descricao"
                rows="5"
                placeholder="Descreva o produto..."
                class="border border-slate-200 rounded-xl p-3 resize-none outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
        </div>

        <!-- FOTOS -->
        <div class="flex flex-col gap-3">

            <label class="text-slate-700 font-semibold">
                Fotos do produto
            </label>

            <div class="grid grid-cols-3 gap-3">

                <!-- FOTO 1 -->
                <label class="image-box border-2 border-dashed border-slate-300 rounded-2xl h-32 flex items-center justify-center cursor-pointer hover:border-blue-500 transition overflow-hidden relative">

                    <span class="placeholder text-slate-500 text-sm">
                        +
                    </span>

                    <input
                        required
                        type="file"
                        name="images"
                        accept="image/*"
                        class="hidden"
                    >

                    <img class="hidden w-full h-full object-cover absolute inset-0">

                </label>

                <!-- FOTO 2 -->
                <label class="image-box border-2 border-dashed border-slate-300 rounded-2xl h-32 flex items-center justify-center cursor-pointer hover:border-blue-500 transition overflow-hidden relative">

                    <span class="placeholder text-slate-500 text-sm">
                        +
                    </span>

                    <input
                        type="file"
                        name="images"
                        accept="image/*"
                        class="hidden"
                    >

                    <img class="hidden w-full h-full object-cover absolute inset-0">

                </label>

                <!-- FOTO 3 -->
                <label class="image-box border-2 border-dashed border-slate-300 rounded-2xl h-32 flex items-center justify-center cursor-pointer hover:border-blue-500 transition overflow-hidden relative">

                    <span class="placeholder text-slate-500 text-sm">
                        +
                    </span>

                    <input
                        type="file"
                        name="images"
                        accept="image/*"
                        class="hidden"
                    >

                    <img class="hidden w-full h-full object-cover absolute inset-0">

                </label>

            </div>

        </div>

        <!-- BOTÃO -->
        <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 transition text-white font-semibold rounded-2xl p-4 mt-2"
        >
            Publicar anúncio
        </button>

    </form>

</div>

<!-- FLOATING -->
<a
href="/mensagens"
class="fixed bottom-24 right-5 z-50"
>

    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 shadow-xl flex items-center justify-center transition duration-300 hover:scale-110 active:scale-95">

        <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-8 h-8 text-white"
        >
            <path fill-rule="evenodd" d="M4.804 21.644A6.707 6.707 0 0 0 6 21.75a6.721 6.721 0 0 0 3.583-1.029c.774.182 1.584.279 2.417.279 5.322 0 9.75-3.97 9.75-9 0-5.03-4.428-9-9.75-9s-9.75 3.97-9.75 9c0 2.409 1.025 4.587 2.674 6.192.232.226.277.428.254.543a3.73 3.73 0 0 1-.814 1.686.75.75 0 0 0 .44 1.223ZM8.25 10.875a1.125 1.125 0 1 0 0 2.25 1.125 1.125 0 0 0 0-2.25ZM10.875 12a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Zm4.875-1.125a1.125 1.125 0 1 0 0 2.25 1.125 1.125 0 0 0 0-2.25Z" clip-rule="evenodd" />
        </svg>

    </div>

</a>

<script>

document.addEventListener('DOMContentLoaded', () => {

    // MENU ACTIVE
    const home = document.getElementById('home');
    const anunciar = document.getElementById('anunciar');
    const transacoes = document.getElementById('transacoes');
    const perfil = document.getElementById('perfil');

    home?.classList.remove('text-blue-500');
    transacoes?.classList.remove('text-blue-500');
    perfil?.classList.remove('text-blue-500');

    anunciar?.classList.add('text-blue-500');


    // IMAGE PREVIEW
    const inputs = document.querySelectorAll('.image-box input');

    inputs.forEach((input) => {

        input.addEventListener('change', function () {

            const file = this.files[0];

            if (!file) return;

            const box = this.parentElement;
            const img = box.querySelector('img');
            const placeholder = box.querySelector('.placeholder');

            img.src = URL.createObjectURL(file);

            img.classList.remove('hidden');
            placeholder.classList.add('hidden');

        });

    });

});

</script>

{% endblock %}
