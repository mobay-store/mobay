{% extends "base.html" %}

{% block title %}Inbox{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-50 pb-32">

    <!-- HEADER -->
    <div class="sticky top-0 z-40 bg-slate-50/90 backdrop-blur-lg border-b border-slate-200">

        <div class="w-full md:w-[80%] lg:w-[60%] mx-auto p-4 flex flex-col gap-4">

            <!-- TITLE -->
            <div class="flex items-center justify-between">

                <div>

                    <h1 class="text-3xl font-bold text-slate-900">
                        Inbox
                    </h1>

                    <p class="text-slate-500 mt-1">
                        Suas conversas recentes
                    </p>

                </div>

                <!-- ICON -->
                <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center">

                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-7 h-7 text-blue-600"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m3.75 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.97-4.03 9-9 9a8.96 8.96 0 0 1-4.255-1.071L3 21l1.071-4.745A8.96 8.96 0 0 1 3 12c0-4.97 4.03-9 9-9s9 4.03 9 9Z"
                        />
                    </svg>

                </div>

            </div>

            <!-- SEARCH -->
            <div class="relative">

                <input
                type="text"
                placeholder="Pesquisar conversas..."
                class="w-full bg-white border border-slate-200 rounded-2xl pl-14 pr-5 py-4 outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 shadow-sm"
                >

                <!-- SEARCH ICON -->
                <div class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400">

                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-5 h-5"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6 6a7.5 7.5 0 0 0 10.65 10.65Z"
                        />
                    </svg>

                </div>

            </div>

        </div>

    </div>

    <!-- LIST -->
    <div class="w-full md:w-[80%] lg:w-[60%] mx-auto p-4 flex flex-col gap-4">

        {% for message in messages %}

        <!-- CHAT ITEM -->
        <div
        onclick="window.location.href='/chat/res/{{message.chat_id}}+{{message.product_id}}+None'"
        class="
        bg-white
        border
        border-slate-200
        rounded-3xl
        p-4
        flex
        items-center
        gap-4
        shadow-sm
        hover:shadow-xl
        transition
        duration-300
        cursor-pointer
        "
        >

            <!-- AVATAR -->
            <div class="relative shrink-0">

                <div class="w-16 h-16 rounded-2xl bg-blue-100 flex items-center justify-center overflow-hidden">

                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-8 h-8 text-blue-600"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275"
                        />
                    </svg>

                </div>

                <!-- ONLINE -->
                <div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-white rounded-full"></div>

            </div>

            <!-- INFO -->
            <div class="flex-1 min-w-0 flex flex-col gap-1">

                <!-- TOP -->
                <div class="flex items-center justify-between gap-3">

                    <span class="font-bold text-slate-900 truncate">
                        {{message.product}}
                    </span>

                    <span class="text-xs text-slate-400 shrink-0">
                        {{message.last_date}}
                    </span>

                </div>

                <!-- MESSAGE -->
                <div class="text-slate-500 truncate text-sm">

                    {{message.message}}

                </div>

                <!-- PRODUCT -->
                <div class="flex items-center gap-2 mt-1">

                    <span class="bg-slate-100 text-slate-700 text-xs px-3 py-1 rounded-full font-medium truncate">

                        {{message.other_name}}

                    </span>

                    <span class="text-blue-600 text-sm font-bold shrink-0">

                        222 MZN

                    </span>

                </div>

            </div>

            <!-- BADGE -->
            <div class="shrink-0">

                <div class="min-w-[28px] h-7 px-2 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center shadow-lg">

                    2

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>



{% endblock %}
